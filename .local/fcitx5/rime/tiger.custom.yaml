# 虎码方案 - 个人微调（fcitx5-rime / Linux）
#
# 说明：# 号是注释符，删掉行首的 # 才会生效。
# Weasel（小狼毫）专用的 style/* 皮肤选项在 fcitx5 下不生效，已从本文件移除；
# 候选窗外观（横排/竖排、字号、字体、间距）请在 fcitx5 的主题设置里调。

patch:
  translator/dictionary: tiger.extended # 引入增补自定词典，这个不要改动
  #translator/enable_completion: true # 编码提示，默认关闭，删掉行首的 # 号即可开启
  #speller/auto_select_pattern: ^;\w+|^\w{4}$ # 四码上屏：默认只对分号引导的编码生效，加上 |^\w{4}$ 即四码上屏
  #speller/alphabet: ";'zyxwvutsrqponmlkjihgfedcba" # 让【】能直接上屏（代价：重复上屏功能失效）

  menu/page_size: 9 # 候选个数，与下面的标号数量保持一致
  # 候选序号（fcitx5 下有效）；想用阿拉伯数字，直接注释掉这行
  menu/alternative_select_labels: [ ①,②,③,④,⑤,⑥,⑦,⑧,⑨ ]
  # 以下是备选样式（只能生效一种）
  #menu/alternative_select_labels: [ ㊀,㊁,㊂,㊃,㊄,㊅,㊆,㊇,㊈ ]
  #menu/alternative_select_labels: [ ❶,❷,❸,❹,❺,❻,❼,❽,❾ ]
  #menu/alternative_select_labels: [ ⓵,⓶,⓷,⓸,⓹,⓺,⓻,⓼,⓽ ]
  #menu/alternative_select_labels: [ ㈠,㈡,㈢,㈣,㈤,㈥,㈦,㈧,㈨ ]
  #menu/alternative_select_labels: [ 🀇,🀈,🀉,🀊,🀋,🀌,🀍,🀎,🀏 ]
  #menu/alternative_select_labels: [ Ⅰ,Ⅱ,Ⅲ,Ⅳ,Ⅴ,Ⅵ,Ⅶ,Ⅷ,Ⅸ ]
  #menu/alternative_select_labels: [ Ⓐ,Ⓑ,Ⓒ,Ⓓ,Ⓔ,Ⓕ,Ⓖ,Ⓗ,Ⓘ ]

  # 拼音滤镜后面那对（拼音）括号，想改样式可在这里调
  #pinyin/comment_format:
  #  - 'xform/&nbsp;/ /'
  #  - 'xform/^/ /'
  #  - 'xform/（//'
  #  - 'xform/）//'
