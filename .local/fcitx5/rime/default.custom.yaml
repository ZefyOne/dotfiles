# 方案列表与全局按键（fcitx5-rime / 虎码）
patch:
  schema_list:
    # - {schema: tiger}
    - {schema: tigress}
    - {schema: PY_c}
  "switcher/hotkeys":  # 方案选单热键（Rime 默认是 F4，这里改成 Ctrl+`）
    - "Control+grave"
    - "Control+F8"
    # - "F4"
    # 想用 F4 切换，把上一行的 # 删掉即可

  ascii_composer/good_old_caps_lock: true
  ascii_composer/switch_key:
    Caps_Lock: clear # 大写锁定：清屏并切到西文
    # 想让 Caps Lock 只改变大小写、不切中西文，把上面改成 noop
    Control_L: noop # 主动失效
    Control_R: noop
    Eisu_toggle: clear
    # Shift 不在 Rime 内处理：
    #   左 Shift 由 fcitx5 的“切换输入法”触发键负责（Rime <-> 英文输入法），在 fcitx5 全局配置里维护
    #   右 Shift 留给另一个输入法引擎，Rime 不接管
    # 原来的 Shift_L/Shift_R: commit_code 会先在 Rime 内部切一次中英状态，与 fcitx5 的切换叠加，已停用
    Shift_L: noop
    Shift_R: noop
