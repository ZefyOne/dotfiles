#键盘布局
preset_keyboards:
  default:
    name: 26键默认布局
    label_transform: uppercase #uppercase|none 中文模式下的字母標籤自動大寫
    width: 8
    lock: true
    height: *jpgd4
    horizontal_gap: 2
    vertical_gap: 0
    ascii_mode: 0
    keys:
      - {height: *jpgd41, width: 5, key_back_color: color_letter_b, key_text_color: color_letter_f}
      - {height: *jpgd41, click: '1', long_click: '!',key_back_color: color_num_b, key_text_color: color_num_f,key_text_size : 16}
      - {click: '2', long_click: '@',key_back_color: color_num_b, key_text_color: color_num_f, key_symbol_color: color_num_f, key_text_size : 16}
      - {click: '3', long_click: '#',key_back_color: color_num_b, key_text_color: color_num_f, key_symbol_color: color_num_f, key_text_size : 16}
      - {click: '4', long_click: '$',key_back_color: color_num_b, key_text_color: color_num_f, key_symbol_color: color_num_f, key_text_size : 16}
      - {click: '5', long_click: '%',key_back_color: color_num_b, key_text_color: color_num_f, key_symbol_color: color_num_f, key_text_size : 16}
      - {width: 10, key_back_color: color_letter_b, key_text_color: color_letter_f}
      - {click: '6', long_click: '^',key_back_color: color_num_b, key_text_color: color_num_f, key_symbol_color: color_num_f, key_text_size : 16}
      - {click: '7', long_click: '&',key_back_color: color_num_b, key_text_color: color_num_f, key_symbol_color: color_num_f, key_text_size : 16}
      - {click: '8', long_click: '*',key_back_color: color_num_b, key_text_color: color_num_f, key_symbol_color: color_num_f, key_text_size : 16}
      - {click: '9', long_click: '(',key_back_color: color_num_b, key_text_color: color_num_f, key_symbol_color: color_num_f, key_text_size : 16}
      - {click: '0', long_click: ')',key_back_color: color_num_b, key_text_color: color_num_f, key_symbol_color: color_num_f, key_text_size : 16}
      - {height: *jpgd41, width: 5, key_back_color: color_letter_b, key_text_color: color_letter_f}
           
      - {width: 5, key_back_color: color_letter_b, key_text_color: color_letter_f}
      - {click: q, long_click: 'Hide', key_back_color: color_letter_b, key_text_color: color_letter_f}
      - {click: w, long_click: '`', key_back_color: color_letter_b, key_text_color: color_letter_f}
      - {click: e, long_click: "{", key_back_color: color_letter_b, key_text_color: color_letter_f}
      - {click: r, long_click: "}", key_back_color: color_letter_b, key_text_color: color_letter_f}
      - {click: t, long_click: "|", key_back_color: color_letter_b, key_text_color: color_letter_f}
      - {width: 10, key_back_color: color_letter_b, key_text_color: color_letter_f}
      - {click: y, long_click: '_', key_back_color: color_letter_b, key_text_color: color_letter_f}
      - {click: u, long_click: '-', key_back_color: color_letter_b, key_text_color: color_letter_f}
      - {click: i, long_click: '+', key_back_color: color_letter_b, key_text_color: color_letter_f}
      - {click: o, long_click: '=', key_back_color: color_letter_b, key_text_color: color_letter_f}
      - {click: p, long_click: '\', key_back_color: color_letter_b, key_text_color: color_letter_f}
      - {width: 5, key_back_color: color_letter_b, key_text_color: color_letter_f}

#      - {width: 100,  height: 2, key_back_color: color_letter_b, key_text_color: color_letter_f}
      
      - {width: 5, key_back_color: color_letter_b, key_text_color: color_letter_f}
      - {width: 2, key_back_color: color_letter_b, key_text_color: color_letter_f}
      - {click: a, long_click: select_all, key_back_color: color_letter_b, key_text_color: color_letter_f}
      - {click: s, long_click: '~', key_back_color: color_letter_b, key_text_color: color_letter_f}
      - {click: d, long_click: "[", key_back_color: color_letter_b, key_text_color: color_letter_f}
      - {click: f, long_click: "]", key_back_color: color_letter_b, key_text_color: color_letter_f}
      - {click: g, long_click: '<', key_back_color: color_letter_b, key_text_color: color_letter_f}
      - {width: 10, key_back_color: color_letter_b, key_text_color: color_letter_f}
      - {click: h, long_click: '>', key_back_color: color_letter_b, key_text_color: color_letter_f}
      - {click: j, long_click: "'", key_back_color: color_letter_b, key_text_color: color_letter_f}
      - {click: k, long_click: '"', key_back_color: color_letter_b, key_text_color: color_letter_f}
      - {click: l, long_click: '/', key_back_color: color_letter_b, key_text_color: color_letter_f}
      - {width: 6, key_back_color: color_letter_b, key_text_color: color_letter_f}
      - {width: 5, key_back_color: color_letter_b, key_text_color: color_letter_f}

#      - {width: 100,  height: 2, key_back_color: color_letter_b, key_text_color: color_letter_f}

      - {width: 5, key_back_color: color_letter_b, key_text_color: color_letter_f}
      - {click: Shift_L, width: 4}
      - {click: z, long_click: 'Hide', key_back_color: color_letter_b, key_text_color: color_letter_f}
      - {click: x, long_click: cut, key_back_color: color_letter_b, key_text_color: color_letter_f}
      - {click: c, long_click: copy, key_back_color: color_letter_b, key_text_color: color_letter_f}
      - {click: v, long_click: paste, key_back_color: color_letter_b, key_text_color: color_letter_f}
      - {click: b, long_click: ";", key_back_color: color_letter_b, key_text_color: color_letter_f}
#      - {click: space, long_click: Return, swipe_left: "Left", swipe_right: "Right", width: 23, key_back_color: color_space_b, key_text_color: color_space_f}
      - {width: 2, key_back_color: color_letter_b, key_text_color: color_letter_f}
      - {click: b, long_click: ";", key_back_color: color_letter_b, key_text_color: color_letter_f}
      - {click: n, long_click: ":", key_back_color: color_letter_b, key_text_color: color_letter_f}
      - {click: m, long_click: '?', key_back_color: color_letter_b, key_text_color: color_letter_f}
      - {click: BackSpace,  width: 20, key_back_color: color_func_b, key_text_color: color_func_f, key_symbol_color: color_func_f}
      - {width: 5, key_back_color: color_letter_b, key_text_color: color_letter_f}

#      - {height: 2, width: 100, key_back_color: color_letter_b, key_text_color: color_letter_f}


      - {height: *jpgd42, click: Mode_switch, long_click: Keyboard_number, width: 12, key_back_color: color_func_b, key_text_color: color_func_f, key_symbol_color: color_func_f}
      - {width: 12, click: ',', label: '，',  key_back_color: color_func_b, key_text_color: color_func_f}
      - {click: space, long_click: Return, swipe_left: "Left", swipe_right: "Right", width: 52, key_back_color: color_space_b, key_text_color: color_space_f}
      - {width: 12, click: '.', label: '。', key_back_color: color_func_b, key_text_color: color_func_f}
      - {click: Return, swipe_up: Theme_settings, long_click: Menu, width: 12, key_back_color: color_func_b, key_text_color: color_func_f, key_symbol_color: color_func_f}
      - {height: 10, width: 100, key_back_color: color_letter_b, key_text_color: color_letter_f}

  number:
    author: "暖暖"
    name: 数字+
    lock: true
    width: 20
    height: 45
    ascii_mode: 0
    key_text_size: 15 #键字号
    keys:
    
      - {click: ',', long_click: '!', key_back_color: bgn, key_text_color: tgn}
      - {click: 1, label: '1', long_click: select_all}
      - {click: 2, label: '2', long_click: copy}
      - {click: 3, label: '3', long_click: paste}
      - {click: BackSpace, key_back_color: bbs, key_text_color: tbs}

      - {click: '.', long_click: '?', key_back_color: bgn, key_text_color: tgn}
      - {click: 4, label: '4'}
      - {click: 5, label: '5'}
      - {click: 6, label: '6'}
      - {label: 123, click: Mode_switch, key_back_color: bgn, key_text_color: tgn}

      - {click: '?', long_click: ':', key_back_color: bgn, key_text_color: tgn}
      - {click: 7, label: '7'}
      - {click: 8, label: '8'}
      - {click: 9, label: '9'}
      - {label: 123, click: Mode_switch, key_back_color: bgn, key_text_color: tgn}


      - {click: Keyboard_letter, long_click: ':', key_back_color: bgn, key_text_color: 'tgn'}
      - {click: 0, long_click: cut}
      - {click: space1, label: 空格, key_back_color: bgn, key_text_color: tgn, width: 40}
      - {click: Return, long_click: Menu, key_back_color: benter, key_text_color: tenter}

      - {height: 20, width: 100, key_back_color: color_letter_b, key_text_color: color_letter_f}
     


preset_keys:
  # 安卓
  BRIGHTNESS_DOWN: {label: 亮度-, send: BRIGHTNESS_DOWN}
  BRIGHTNESS_UP: {label: 亮度+, send: BRIGHTNESS_UP}
  CALCULATOR: {label: 計算機, send: CALCULATOR}
  CALENDAR: {label: 日曆, send: CALENDAR}
  CONTACTS: {label: 電話簿, send: CONTACTS}
  ENVELOPE: {label: 信箱, send: ENVELOPE}
  EXPLORER: {label: 瀏覽器, send: EXPLORER}
  MUSIC: {label: 音樂, send: MUSIC}
  POWER: {label: 電源, send: POWER}
  SEARCH: {label: 搜尋, send: Find}
  SLEEP: {label: 休眠, send: SLEEP}
  VOICE_ASSIST: {label: 語音, send: VOICE_ASSIST}
  VOLUME_DOWN: {label: 音量-, send: VOLUME_DOWN}
  VOLUME_UP: {label: 音量+, send: VOLUME_UP}
  VOLUME_MUTE: {label: 靜音, send: VOLUME_MUTE}
  # 編輯
  Shift_L: {label: ⇧, send: Shift_L, shift_lock: ascii_long}
  Return: {label: ↲, send: Return}
  Hide: {label: 隐藏, send: BACK}
  BackSpace: {label: ←, repeatable: true, send: BackSpace}
  space: {repeatable: false, label: '_______',  functional: false, send: space}
  space1: {repeatable: false, label: '空格', functional: false, send: space}
  Escape: {label: Esc, send: Escape}
  Home: {label: 行首, send: Home}
  Insert: {label: 插入, send: Insert}
  Delete: {label: 刪除, send: Delete}
  End: {label: 行尾, send: End}
  Page_Up: {label: 上頁, send: Page_Up}
  Page_Down: {label: 下頁, send: Page_Down}
  Left: {label: '←', send: Left}
  Down: {label: '↓', send: Down}
  Up: {label: '↑', send: Up}
  Right: {label: '→', send: Right}
  select_all: {label: 全选, send: Control+a}
  Clear: {label: 清除, text: "{Control+a}{BackSpace}"} #全選並刪除
  cut: {label: 剪切, send: Control+x}
  cut_all: {label: 全挪, text: "{Control+a}{Control+x}"} #全選並剪切
  copy: {label: 复制, send: Control+c}
  copy_all: {label: 全謄, text: "{Control+a}{Control+c}"} #全選並複製
  paste: {label: 粘贴, send: Control+v}
  paste_text: {label: 貼上文本, send: Control+Shift+Alt+v} #>=Android 6.0
  share_text: {label: 分享文本, send: Control+Alt+s} #>=Android 6.0
  redo: {label: 重做, send: Control+y} #>=Android 6.0
  undo: {label: 撤銷, send: Control+z} #>=Android 6.0
  # rime組合鍵
  F4: {label: 方案選單, send: F4}
  BackToPreviousSyllable: {label: 刪音節, send: Control+BackSpace}
  CommitRawInput: {label: 編碼, send: Control+Return}
  CommitScriptText: {label: 編碼, send: Shift+Return}
  CommitComment: {label: 編碼, send: Control+Shift+Return}
  DeleteCandidate: {label: 刪詞, send: Control+Delete}
  # rime狀態
  Mode_switch: {toggle: ascii_mode, send: Mode_switch, states: [ 中文, 西文 ]}
  Zenkaku_Hankaku: {toggle: full_shape, send: Mode_switch, states: [ 半角, 全角 ]}
  Henkan: {toggle: simplification, send: Mode_switch, states: [ 漢字, 汉字 ]}
  Charset_switch: {toggle: extended_charset, send: Mode_switch, states: [ 常用, 增廣 ]}
  Punct_switch: {toggle: ascii_punct, send: Mode_switch, states: [ 。，, ．， ]}
  # trime設定
  IME_switch: {label: 🌐, send: LANGUAGE_SWITCH} #彈出對話框選擇輸入法
  IME_last: {label: 上一輸入法, send: LANGUAGE_SWITCH, select: .last} #直接切換到上一輸入法
  IME_next: {label: 下一輸入法, send: LANGUAGE_SWITCH, select: .next} #直接切換到下一輸入法
  Keyboard_symbols: {label: 符號, send: Eisu_toggle, select: symbols}
  Keyboard_number: {label: 123, send: Eisu_toggle, select: number}
  Keyboard_letter: {label: 字母, send: Eisu_toggle, select: default}
  Keyboard_default: {label: 返回, send: Eisu_toggle, select: .default}
  Keyboard_switch: {label: 鍵盤, send: Eisu_toggle, select: .next}
  Schema_switch: {label: 下一方案, send: Control+Shift+1}
  Color_switch: {label: 配色, send: PROG_RED}
  Help: {label: 說明, send: Help}
  Info: {label: 關於, send: INFO}
  Menu: {label: ⚙, send: Menu}
  Settings: {label: 設定, send: SETTINGS}
  Color_settings: {label: 配色, send: SETTINGS, option: "color"}
  Theme_settings: {label: 主題, send: SETTINGS, option: "theme"}
  Schema_settings: {label: 方案, send: SETTINGS, option: "schema"}
  Candidate_switch: {toggle: _hide_candidate, send: Mode_switch, states: [ 有候選, 無候選]}
  Comment_switch: {toggle: _hide_comment, send: Mode_switch, states: [ 有註釋, 無註釋]}
  Hint_switch: {toggle: _hide_key_hint, send: Mode_switch, states: [ 有助記, 無助記]}
  # trime命令
  Date: {label: 日期, command: date, option: "yyyy-MM-dd"}
  ChineseDate: {label: 農曆, command: date, option: "zh_CN@calendar=chinese"} #農曆等日期(>=Android 7.0)：date 語言@calendar=曆法 格式。具體參見https://developer.android.com/reference/android/icu/util/Calendar.html
  Time: {label: 時間, command: date, option: "HH:mm:ss"} #時間： date 格式
  TrimeApp: {label: 同文, command: run, option: "com.osfans.trime"} #運行程序: run 包名
  TrimeCmp: {label: 同文組件, command: run, option: "com.osfans.trime/.Pref"} #運行程序指定組件: run 包名/組件名
  Homepage: {label: 同文主頁, command: run, option: "https://github.com/osfans/trime"} #查看網頁: run 網址
  CommitHomepage: {label: 同文網址, commit: https://github.com/osfans/trime} #直接上屏
  Wiki: {label: 維基, command: run, option: "https://zh.wikipedia.org/wiki/%s"} #搜索網頁: %s或者%1$s爲當前字符
  Google: {label: 谷歌, command: run, option: "https://www.google.com/search?q=%s"} #搜索網頁: %s或者%1$s爲當前字符
  MoeDict: {label: 萌典, command: run, option: "https://www.moedict.tw/%3$s"} #搜索網頁: %3$s爲光標前字符
  Baidu: {label: 百度搜索, command: run, option: "https://www.baidu.com/s?wd=%4$s"} #搜索網頁: %4s爲光標前所有字符
  Zdic: {label: 漢典, command: run, option: "http://www.zdic.net/sousuo/?q=%1$s"} #搜索網頁: %s或者%1$s爲當前字符
  Zdic2: {label: 漢典, command: run, option: "http://www.zdic.net/sousuo/?q=%2$s"} #搜索網頁: %2$s爲當前輸入的編碼
  WebSearch: {label: 搜索網頁, command: web_search, option: "%4$s"} #搜索，其他view、dial、edit、search等intent，參考安卓的intent文檔：https://developer.android.com/reference/android/content/Intent.html
  Search: {label: 搜索, command: search, option: "%1$s"} #搜索短信、字典等
  Share: {label: 分享, command: send, option: "%s"} #分享指定文本: %s或者%1$s爲當前字符
  Deploy: {label: 部署, command: broadcast, option: "com.osfans.trime.deploy"}
  Sync: {label: 同步, command: broadcast, option: "com.osfans.trime.sync"}


style:
  auto_caps: false
  background_dim_amount: 0.5
  candidate_font: TH-Feon.ttf
  candidate_padding: 10
  candidate_spacing: 2.5
  candidate_text_size: 24
  candidate_use_cursor: true
  candidate_view_height: 32
  color_scheme: default
  comment_font: comment.ttf
  comment_height: 14
  comment_on_top: true
  comment_text_size: 12
  enter_label_mode: 0
  enter_labels:
    default: Enter
    done: "完成"
    go: "前往"
    next: "下个"
    pre: "上个"
    search: "搜索"
    send: "发送"
  hanb_font: TH-Feon.ttf
  horizontal: true
  horizontal_gap: *hgap #键水平间距
  key_font: symbol.ttf
  key_height: *jpgd4
  key_long_text_border: 1
  key_long_text_size: 18
  key_text_size: 22
  key_width: 10.0
  keyboard_height: 300
  keyboard_height_land: 300
  keyboard_padding: 0
  keyboard_padding_bottom: 0
  keyboard_padding_land: 0
  keyboard_padding_land_bottom: 0
  keyboard_padding_left: 100
  keyboard_padding_right: 100
  keyboards:
    - .default
    - default
    - number
  label_font: label.ttf
  label_text_size: 22
  latin_font: latin.ttf
  latin_locale: en_US
  layout:
    alpha: 0xdd
    border: 2
    elevation: 5
    line_spacing: 0
    line_spacing_multiplier: 1.2
    margin_x: 5
    margin_y: 5
    max_height: 400
    max_width: 230
    min_height: 0
    min_width: 40
    round_corner: *round2 #候选窗口圆角
    spacing: 1
  locale: zh_TW
  long_text_font: comment.ttf
  preview_font: latin.ttf
  preview_height: 60
  preview_offset: "-12"
  preview_text_size: 40
  proximity_correction: true
  reset_ascii_mode: false
  round_corner: *round1
  shadow_radius: 0.0
  speech_opencc_config: s2t.json
  symbol_font: symbol.ttf
  symbol_text_size: 10
  text_font: latin.ttf
  text_size: 16
  vertical_correction: "-5"
  vertical_gap: *sgap