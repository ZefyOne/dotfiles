
config_version: "3.0"
name: blackpink         #方案名称
author: unknown        #作者信息

#键盘高度
height:
  1: &jpgd1 30 #表情键盘
  2: &jpgd2 24 #颜文字键盘1
  3: &jpgd3 24 #颜文字键盘2
  4: &jpgd4 43 #主键盘
  5: &jpgd5 39.5 #符号键盘
  6: &hgap 4 #键盘横缝大小
  7: &sgap 5 #键盘竖缝大小
  8: &jpgd41 45 #数字行高度
  9: &jpgd42 55 #空格行高度

#键盘高度
round_corner:
  1: &round1 25 #按键圆角半径
  2: &round2 0 #候选窗口圆角
  3: &round3 25 #回车键圆角
  
#界面风格、功能开关
style:
  auto_caps: false #自動句首大寫:true|false|ascii
  background_dim_amount: 0.5
  candidate_font: TH-Feon.ttf #sunmanpua.ttf  #候选字体
  candidate_padding: 5  #候选项内边距
  candidate_spacing: 0.5  #候选间距
  candidate_text_size: 18  #候选字号
  candidate_use_cursor: true #高亮候选项
  candidate_view_height: 28 #候选区高度
  color_scheme: default #配色方案
  comment_font: comment.ttf #编码提示字体
  comment_height: 14 #编码提示区高度
  comment_on_top: true #编码提示在上方或右侧
  comment_text_size: 12 #编码提示字号
  hanb_font: TH-Feon.ttf #扩充字体
  horizontal: true #水平模式
  horizontal_gap: *hgap #键水平间距
  layout:
    position: fixed #候选窗口位置：left|right|left_up|right_up|fixed|bottom_left|bottom_right|top_left|top_right(left、right需要Android5.0以上)
    min_length: 4 #候选窗口最小词长
    max_length: 14 #超过字数则换行
    sticky_lines: 1 #固顶行数
    max_entries: 5 #候选窗口最大词条数
    border: 0 #候选窗口边框宽度
    max_width: 360 #最大宽度，超过则自动换行
    max_height: 300 #最大高度
    min_width: 0 #最小宽度
    min_height: 50 #最小高度
    margin_x: 5 #水平边距
    margin_y: 5 #竖直边距
    line_spacing: 0 #候选词的行间距(px)
    line_spacing_multiplier: 1.2 #候选词的行间距(倍数)
    spacing: 1 #与预编辑或边缘的距离
    round_corner: *round2 #候选窗口圆角
    alpha: 0xff #透明度(0-255)
    elevation: 0 #阴影(>=Android5.0)
    background: background.png #颜色或者backgrounds目录下的图片文档名
    movable: false #是否可移动窗口，或仅移动一次 true|false|once
    all_phrases: false #显示所有长词
  window: #悬浮窗口组件
  #    - {start: "", move: 'ㄓ ', end: ""}
    - {start: "", composition: "%s", end: "", letter_spacing: 0.12} #letter_spacing需要Android5.0
    - {start: "\n", label: "%s.", candidate: "%s", comment: "%s", end: "", sep: "☁️️"}
  key_font: symbol.ttf #键盘字体
  key_height: *jpgd4 #键高
  key_long_text_size: 18 #长标签字号
  key_text_size: 20 #键字号
  key_width: 10.0 #键宽，占屏幕宽的百分比
  keyboards: [.default, default, number] #键盘配置
  label_text_size: 22 #标签字号
  label_font: label.ttf #编标签字体
  latin_font: latin.ttf #西文本体
  latin_locale: en_US #西文语言
  locale: zh_CN #缺省语言 zh_TW,zh_CN,zh_HK,""
  preview_font: latin.ttf #按键提示字体
  preview_height: 56 #按键提示高度
  preview_offset: -32 #按键提示纵向偏移
  preview_text_size: 40 #按键提示字号
  proximity_correction: true #按键纠错
  reset_ascii_mode: false #显示键盘时重置为中文状态
  round_corner: *round1 #按键圆角半径
  shadow_radius: 0.0 #按键阴影半径
  speech_opencc_config: none #语音输入简繁转换
  symbol_font: symbol.ttf #符号字体
  symbol_text_size: 9 #符号字号
  text_font: latin.ttf #编码字体
  #text_height: 32 #编码区高度
  text_size: 14 #编码区字号
  vertical_correction: -5
  vertical_gap: *sgap #键盘行距

  keyboard_height: 300
  keyboard_height_land: 300
  keyboard_padding: 0
  keyboard_padding_bottom: 0
  keyboard_padding_land: 0
  keyboard_padding_land_bottom: 0
  keyboard_padding_left: 100
  keyboard_padding_right: 100
  keyboards:
    - .default
    - default
    - number

fallback_colors:
  candidate_text_color: text_color
  comment_text_color: candidate_text_color
  border_color: back_color
  candidate_separator_color: border_color
  hilited_text_color: text_color
  hilited_back_color: back_color
  hilited_candidate_text_color: hilited_text_color
  hilited_candidate_back_color: hilited_back_color
  hilited_comment_text_color: comment_text_color
  text_back_color: back_color
  hilited_key_back_color: hilited_candidate_back_color
  hilited_key_text_color: hilited_candidate_text_color
  hilited_key_symbol_color: hilited_comment_text_color
  hilited_off_key_back_color: hilited_key_back_color
  hilited_on_key_back_color: hilited_key_back_color
  hilited_off_key_text_color: hilited_key_text_color
  hilited_on_key_text_color: hilited_key_text_color
  key_back_color: back_color
  key_border_color: border_color
  key_text_color: candidate_text_color
  key_symbol_color: comment_text_color
  keyboard_back_color: border_color
  label_color: candidate_text_color
  off_key_back_color: key_back_color
  off_key_text_color: key_text_color
  on_key_back_color: hilited_key_back_color
  on_key_text_color: hilited_key_text_color
  preview_back_color: key_back_color
  preview_text_color: key_text_color
  shadow_color: border_color


BlackPink_colors:
  1: &BlackPink_f0  0xfff0a6aa #主键
  2: &BlackPink_b0  0xff1e1e1e  
  3: &BlackPink_f1  0xfff0a6aa #功能键
  4: &BlackPink_b1  0xff1e1e1e  
  5: &BlackPink_f2  0xff000000 #空格
  6: &BlackPink_b2  0xfff0a6aa 
  7: &BlackPink_f3  0xfff0a6aa #数字行
  8: &BlackPink_b3  0x00000000 
  9: &BlackPink_f4  0xfff0a6aa #底版
  9: &BlackPink_b4  0xff505050 #底版
  
Composition_colors:
  1: &Composition_f0  0xff303030 #主键
  2: &Composition_b0  0xffe6e5e0
  3: &Composition_f1  0xfff0f0f0 #功能键
  4: &Composition_b1  0xff20233b  
  5: &Composition_f2  0xff000000 #空格
  6: &Composition_b2  0xffe4b448 
  7: &Composition_f3  0xfff0f0f0 #数字行
  8: &Composition_b3  0xff942828 
  9: &Composition_f4  0xffffffff #底版
  10: &Composition_b4  0xff303030 #底版


#键盘布局
preset_keyboards:
  default:
    name: 26键默认布局
    label_transform: uppercase #uppercase|none 中文模式下的字母標籤自動大寫
    width: 10
    lock: true
    height: *jpgd4
    horizontal_gap: 2
    vertical_gap: 0
    ascii_mode: 0
    keys:
      - {height: *jpgd41, click: '1', long_click: '!',key_back_color: color_num_b, key_text_color: color_num_f,key_text_size : 16}
      - {click: '2', long_click: '@',key_back_color: color_num_b, key_text_color: color_num_f, key_symbol_color: color_num_f, key_text_size : 16}
      - {click: '3', long_click: '#',key_back_color: color_num_b, key_text_color: color_num_f, key_symbol_color: color_num_f, key_text_size : 16}
      - {click: '4', long_click: '$',key_back_color: color_num_b, key_text_color: color_num_f, key_symbol_color: color_num_f, key_text_size : 16}
      - {click: '5', long_click: '%',key_back_color: color_num_b, key_text_color: color_num_f, key_symbol_color: color_num_f, key_text_size : 16}
      - {click: '6', long_click: '^',key_back_color: color_num_b, key_text_color: color_num_f, key_symbol_color: color_num_f, key_text_size : 16}
      - {click: '7', long_click: '&',key_back_color: color_num_b, key_text_color: color_num_f, key_symbol_color: color_num_f, key_text_size : 16}
      - {click: '8', long_click: '*',key_back_color: color_num_b, key_text_color: color_num_f, key_symbol_color: color_num_f, key_text_size : 16}
      - {click: '9', long_click: '(',key_back_color: color_num_b, key_text_color: color_num_f, key_symbol_color: color_num_f, key_text_size : 16}
      - {click: '0', long_click: ')',key_back_color: color_num_b, key_text_color: color_num_f, key_symbol_color: color_num_f, key_text_size : 16}
            
      - {click: q, long_click: 'Hide', key_back_color: color_letter_b, key_text_color: color_letter_f}
      - {click: w, long_click: '`', key_back_color: color_letter_b, key_text_color: color_letter_f}
      - {click: e, long_click: "{", key_back_color: color_letter_b, key_text_color: color_letter_f}
      - {click: r, long_click: "}", key_back_color: color_letter_b, key_text_color: color_letter_f}
      - {click: t, long_click: "|", key_back_color: color_letter_b, key_text_color: color_letter_f}
      - {click: y, long_click: '_', key_back_color: color_letter_b, key_text_color: color_letter_f}
      - {click: u, long_click: '-', key_back_color: color_letter_b, key_text_color: color_letter_f}
      - {click: i, long_click: '+', key_back_color: color_letter_b, key_text_color: color_letter_f}
      - {click: o, long_click: '=', key_back_color: color_letter_b, key_text_color: color_letter_f}
      - {click: p, long_click: '\', key_back_color: color_letter_b, key_text_color: color_letter_f}

      - {width: 100,  height: 3, key_back_color: color_letter_b, key_text_color: color_letter_f}
      
      - {width: 5, key_back_color: color_letter_b, key_text_color: color_letter_f}
      - {click: a, long_click: select_all, key_back_color: color_letter_b, key_text_color: color_letter_f}
      - {click: s, long_click: '~', key_back_color: color_letter_b, key_text_color: color_letter_f}
      - {click: d, long_click: "[", key_back_color: color_letter_b, key_text_color: color_letter_f}
      - {click: f, long_click: "]", key_back_color: color_letter_b, key_text_color: color_letter_f}
      - {click: g, long_click: '<', key_back_color: color_letter_b, key_text_color: color_letter_f}
      - {click: h, long_click: '>', key_back_color: color_letter_b, key_text_color: color_letter_f}
      - {click: j, long_click: "'", key_back_color: color_letter_b, key_text_color: color_letter_f}
      - {click: k, long_click: '"', key_back_color: color_letter_b, key_text_color: color_letter_f}
      - {click: l, long_click: '/', key_back_color: color_letter_b, key_text_color: color_letter_f}
      - {width: 5, key_back_color: color_letter_b, key_text_color: color_letter_f}

      - {width: 100,  height: 3, key_back_color: color_letter_b, key_text_color: color_letter_f}


      - {click: Shift_L, width: 15}
      - {click: z, long_click: 'Hide', key_back_color: color_letter_b, key_text_color: color_letter_f}
      - {click: x, long_click: cut, key_back_color: color_letter_b, key_text_color: color_letter_f}
      - {click: c, long_click: copy, key_back_color: color_letter_b, key_text_color: color_letter_f}
      - {click: v, long_click: paste, key_back_color: color_letter_b, key_text_color: color_letter_f}
      - {click: b, long_click: ";", key_back_color: color_letter_b, key_text_color: color_letter_f}
      - {click: n, long_click: ":", key_back_color: color_letter_b, key_text_color: color_letter_f}
      - {click: m, long_click: '?', key_back_color: color_letter_b, key_text_color: color_letter_f}
      - {click: BackSpace,  width: 15, key_back_color: color_func_b, key_text_color: color_func_f, key_symbol_color: color_func_f}

      - {height: 4, width: 100, key_back_color: color_letter_b, key_text_color: color_letter_f}

      - {height: *jpgd42, click: Mode_switch, long_click: Keyboard_number, width: 15, key_back_color: color_func_b, key_text_color: color_func_f, key_symbol_color: color_func_f}
      - {width: 15, click: ',', label: '，',  key_back_color: color_func_b, key_text_color: color_func_f}
      - {click: space, long_click: Return, swipe_left: "Left", swipe_right: "Right", swipe_up: Schema_switchcn, width: 40, key_back_color: color_space_b, key_text_color: color_space_f}
      - {width: 15, click: '.', label: '。', key_back_color: color_func_b, key_text_color: color_func_f}
      - {click: Return, swipe_up: Theme_settings, long_click: Menu, width: 15, key_back_color: color_func_b, key_text_color: color_func_f, key_symbol_color: color_func_f}
      - {height: 20, width: 100, key_back_color: color_letter_b, key_text_color: color_letter_f}

  number:
    author: "暖暖"
    name: 数字+
    lock: true
    width: 20
    height: 45
    ascii_mode: 0
    key_text_size: 15 #键字号
    keys:
    
      - {click: ',', long_click: '!', key_back_color: bgn, key_text_color: tgn}
      - {click: 1, label: '1', long_click: select_all}
      - {click: 2, label: '2', long_click: copy}
      - {click: 3, label: '3', long_click: paste}
      - {click: BackSpace, key_back_color: bbs, key_text_color: tbs}

      - {click: '.', long_click: '?', key_back_color: bgn, key_text_color: tgn}
      - {click: 4, label: '4'}
      - {click: 5, label: '5'}
      - {click: 6, label: '6'}
      - {label: 123, click: Mode_switch, key_back_color: bgn, key_text_color: tgn}

      - {click: '?', long_click: ':', key_back_color: bgn, key_text_color: tgn}
      - {click: 7, label: '7'}
      - {click: 8, label: '8'}
      - {click: 9, label: '9'}
      - {label: 123, click: Mode_switch, key_back_color: bgn, key_text_color: tgn}


      - {click: Keyboard_letter, long_click: ':', key_back_color: bgn, key_text_color: 'tgn'}
      - {click: 0, long_click: cut}
      - {click: space1, label: 空格, key_back_color: bgn, key_text_color: tgn, width: 40}
      - {click: Return, long_click: Menu, key_back_color: benter, key_text_color: tenter}

      - {height: 20, width: 100, key_back_color: color_letter_b, key_text_color: color_letter_f}
      

#--------配色开始----------------#
#配色方案
preset_color_schemes:
  default:
    name: "BlackPink"  #方案名称
    back_color: *BlackPink_b4 #候选区背景状态栏
    candidate_separator_color: 0x00000000 #候选分割背景
    candidate_text_color: *BlackPink_f0 #候选文本
    comment_text_color: *BlackPink_f0  #提示
    hilited_back_color:  0x00000000 #高亮编码背景
    hilited_candidate_back_color: *BlackPink_b2 #高亮候选背景
    hilited_candidate_text_color: *BlackPink_f2 #高亮候选文本
    hilited_comment_text_color: *BlackPink_f2 #高亮提示
    hilited_key_back_color: *BlackPink_b2 #高亮按键背景
    hilited_key_symbol_color: *BlackPink_f2 #高亮按键符号
    hilited_key_text_color: *BlackPink_f2 #高亮按键文本
    hilited_on_key_back_color: *BlackPink_f0 #高亮按键关闭状态背景
    hilited_on_key_text_color: *BlackPink_b0 #高亮按键关闭状态文本
    hilited_off_key_back_color: *BlackPink_b0 #高亮按键关闭状态背景
    hilited_off_key_text_color: *BlackPink_f0 #高亮按键关闭状态文本   
    hilited_text_color: *BlackPink_f0 #高亮编码
    key_back_color: *BlackPink_b0 #按键背景
    key_symbol_color: *BlackPink_f0 #按键符号
    key_text_color: *BlackPink_f0 #按键文本
    keyboard_back_color: *BlackPink_b4 #键盘背景
    label_color: *BlackPink_b0 #标签
    on_key_back_color: *BlackPink_f0 #按鍵打開狀態背景
    on_key_text_color: *BlackPink_b0 #按鍵打開狀態文字    
    off_key_back_color: *BlackPink_b0  #按键关闭状态背景
    off_key_text_color: *BlackPink_f0 #按键关闭状态文本
    preview_back_color: *BlackPink_b0 #按键提示背景
    preview_text_color: *BlackPink_f0 #按键提示文本
    text_color: *BlackPink_f0 #编码
    text_back_color: *BlackPink_b4 #编码区背景
    color_letter_b: *BlackPink_b0 #第一行背景色
    color_letter_f: *BlackPink_f0 #第一行文字颜色
    color_func_b: *BlackPink_b1 #第二行背景色
    color_func_f: *BlackPink_f1 #第二行文字颜色
    color_space_b: *BlackPink_b2 #第三行背景色
    color_space_f: *BlackPink_f2 #第三行文字颜色
    color_num_b: *BlackPink_b3 #第三行背景色
    color_num_f: *BlackPink_f3 #第三行文字颜色


  Composition:
    name: "Composition"  #方案名称
    back_color: *Composition_b4 #候选区背景状态栏
    candidate_separator_color: 0x00000000 #候选分割背景
    candidate_text_color: *Composition_f0 #候选文本
    comment_text_color: *Composition_f0  #提示
    hilited_back_color:  0x00000000 #高亮编码背景
    hilited_candidate_back_color: *Composition_b2 #高亮候选背景
    hilited_candidate_text_color: *Composition_f2 #高亮候选文本
    hilited_comment_text_color: *Composition_f2 #高亮提示
    hilited_key_back_color: *Composition_b2 #高亮按键背景
    hilited_key_symbol_color: *Composition_f2 #高亮按键符号
    hilited_key_text_color: *Composition_f2 #高亮按键文本
    hilited_off_key_back_color: *Composition_b0 #高亮按键关闭状态背景
    hilited_off_key_text_color: *Composition_f0 #高亮按键关闭状态文本
    hilited_text_color: *Composition_f0 #高亮编码
    key_back_color: *Composition_b0 #按键背景
    key_symbol_color: *Composition_f0 #按键符号
    key_text_color: *Composition_f0 #按键文本
    keyboard_back_color: *Composition_b4 #键盘背景
    label_color: *Composition_b0 #标签
    off_key_back_color: *Composition_b0  #按键关闭状态背景
    off_key_text_color: *Composition_f0 #按键关闭状态文本
    preview_back_color: *Composition_b0 #按键提示背景
    preview_text_color: *Composition_f0 #按键提示文本
    text_color: *Composition_f0 #编码
    text_back_color: *Composition_b4 #编码区背景
    color_letter_b: *Composition_b0 #第一行背景色
    color_letter_f: *Composition_f0 #第一行文字颜色
    color_func_b: *Composition_b1 #第二行背景色
    color_func_f: *Composition_f1 #第二行文字颜色
    color_space_b: *Composition_b2 #第三行背景色
    color_space_f: *Composition_f2 #第三行文字颜色
    color_num_b: *Composition_b3 #第三行背景色
    color_num_f: *Composition_f3 #第三行文字颜色

  yushe:
    name: 預設／default #方案名稱
    author: osfans #作者資訊
    back_color: 0xffe4e7e9 #候選區背景
    border_color: 0xffc1c7ca #邊框
    candidate_separator_color: 0xffc1c7ca #候選分割背景
    candidate_text_color: 0xff5a676e #候選文字
    comment_text_color: 0xff7b868c #提示
    hilited_back_color: 0xccd3d7da #標明編碼背景
    hilited_candidate_back_color: 0xffd3d7da #標明候選背景
    hilited_candidate_text_color: 0xff000000 #標明候選文字
    hilited_comment_text_color: 0xff000000 #標明提示
    hilited_key_back_color: 0xffd3d7da #標明按鍵背景
    hilited_key_symbol_color: 0xff000000 #標明按鍵符號
    hilited_key_text_color: 0xff000000 #標明按鍵文字
    hilited_off_key_back_color: 0xffd3d7da #標明按鍵關閉狀態背景
    hilited_off_key_text_color: 0xff000000 #標明按鍵關閉狀態文字
    hilited_on_key_back_color: 0xffd3d7da #標明按鍵打開狀態背景
    hilited_on_key_text_color: 0xff000000 #標明按鍵打開狀態文字
