recognizer:
  import_preset: default
  patterns:
    email: "^[A-Za-z][-_.0-9A-Za-z]*@.*$"
    punct: "^/([0-9]0?|[A-Za-z]+)$"
    reverse_lookup: "^`[a-z]*'?$"
    uppercase: "[A-Z][-_+.'0-9A-Za-z]*$"
    url: "^(www[.]|https?:|ftp[.:]|mailto:|file:).*$|^[a-z]+[.].+$"
reverse_lookup:
  dictionary: pinyin_simp
  preedit_format:
    - "xform/([nl])v/$1ü/"
    - "xform/([nl])ue/$1üe/"
    - "xform/([jqxy])v/$1u/"
  prefix: "`"
  suffix: "'"
  tips: "〔拼音〕"
schema:
  author:
    - {}
  dependencies:
    - pinyin_simp
  description: |
    虎码官方小词库
    敲 ` 鍵進入拼音反查    

  name: "虎码官方小词库"
  schema_id: tigress
  version: 0.9
speller:
  auto_clear: max_length
  auto_select: false
  max_code_length: 4
switches:
  - name: ascii_mode
    reset: 0
    states: ["中文", "西文"]
  - name: extended_char
    reset: 1
    states: ["全集", "常用"]
  - options: [gbk, gb2312, utf8]
    states: [GBK, GB2312, "UTF-8"]
  - options: [_keyboard_default, _keyboard_defaultzj]
    states: ["助记关", "助记开"]
translator:
  dictionary: tigress
  enable_charset_filter: false
  enable_encoder: true
  enable_sentence: false
  enable_user_dict: false
  encode_commit_history: true
  max_phrase_length: 4