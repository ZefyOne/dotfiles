# ==============================================================================
# Kitty Custom Configuration / 用户 Kitty 私有配置
# ==============================================================================
# 本文件在 kitty.conf 末尾被 include，最后加载，覆盖前面所有同名配置。
# 升级部署时本文件会被保留，请把个人定制都写在这里。
# ==============================================================================

# ------------------------------------------------------------------------------
# 字体 / Font
# ------------------------------------------------------------------------------
# 用 Nerd Font 版本，带 prompt/图标字形（普通 JetBrains Mono 没有）
font_family JetBrainsMono Nerd Font
# 12 偏小，13 兼顾信息量和可读性
font_size 13.0

# ------------------------------------------------------------------------------
# 行为 / Behavior
# ------------------------------------------------------------------------------
# 静音，补全失败不要"叮"
enable_audio_bell no

# ------------------------------------------------------------------------------
# 布局 / Layouts
# ------------------------------------------------------------------------------
enabled_layouts splits, tall, fat, grid

# ------------------------------------------------------------------------------
# 键位 / Keybindings（沿用旧 keymaps.conf 的习惯）
# ------------------------------------------------------------------------------
# 标签页
map ctrl+t new_tab
map alt+w close_window
map ctrl+alt+n next_tab
map ctrl+alt+p previous_tab

# 分屏：ctrl+enter 左右分，ctrl+alt+enter 上下分
map ctrl+enter launch --location=hsplit
map ctrl+alt+enter launch --location=vsplit

# 窗格导航（注意：会占用 ctrl+h/j/k/l，vim 用户请自行取舍）
map ctrl+h neighboring_window left
map ctrl+j neighboring_window down
map ctrl+k neighboring_window up
map ctrl+l neighboring_window right

# ------------------------------------------------------------------------------
# 配色覆盖 / Color overrides
# ------------------------------------------------------------------------------
# 默认跟随 themes/noctalia.conf（由 Nyxuri 从 palette 渲染）。
# 想固定某个颜色时在此取消注释即可，例如：
# background #fbf9f8
# foreground #1b1c1b

# ------------------------------------------------------------------------------
# 其他私有配置挂载点 / Extra mounts
# ------------------------------------------------------------------------------
# 如需拆分多个文件，可拷贝到 ~/.config/kitty/ 后在此 include（路径相对本文件）：
# include keymaps.conf
# include glob:*__custom__*.conf
# include glob:__custom__/*.conf
